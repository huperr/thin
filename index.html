<p>worstIdeEver™</p>
<style>
body {background-color: #303030; font-family: 'Trebuchet MS'}
p {color: #E3E3E3; font-size: 24px}
</style>
<div id="inputo" contenteditable="true" spellcheck="false"
style="width: 500px; 
height: 300px; 
background-color: #252525;
padding: 10px;
margin: 5px;
border-radius: 5px;
color: #E3E3E3;
outline: 3px solid #505050;
overflow-y: auto;
scrollbar-color: #505050 #252525;
scrollbar-width: thin;"></div>
<button id="btn" style="background-color: #252525; margin: 5px; outline: 3px solid #505050; color: #E3E3E3; border-radius: 5px;">download</button>
<script>
const inputo = document.getElementById('inputo')
const btn = document.getElementById('btn')

inputo.addEventListener('keydown', (e) => {
	if (e.key === "Tab") {
		e.preventDefault()
		document.execCommand('insertText', false, "        ")
	}
})

btn.addEventListener('click', () => {
	const blob = new Blob([inputo.innerText.replace(/<div><br><\/div>/g,"\n").replace(/<div>/g,"\n").replace(/<\/div>/g,"")], {type: `text/plain`})
	const url = URL.createObjectURL(blob)
	const a = document.createElement('a')
	a.href = url
	a.download = "hi-plz-change-file-type-and-name-aswell.txt"
	a.click()
	URL.revokeObjectURL(url)
})
</script>
